<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Point Tennis</title>
    <script src="skiko.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas#ComposeTarget { display: block; }
    </style>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
    <script>
        // ── Web Speech API ──────────────────────────────────────────────────
        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = "en-US"; u.rate = 1.1;
            window.speechSynthesis.speak(u);
        }

        // ── Web Audio API - sons de bola ────────────────────────────────────
        var audioCtx = null;
        function getCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === "suspended") audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, type, duration, gainVal, fadeOut) {
            try {
                var ctx = getCtx();
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(gainVal, ctx.currentTime);
                if (fadeOut) gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.start(ctx.currentTime); osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        function playNoise(duration, gainVal) {
            try {
                var ctx = getCtx();
                var bufSize = ctx.sampleRate * duration;
                var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                var data = buf.getChannelData(0);
                for (var i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
                var src = ctx.createBufferSource();
                src.buffer = buf;
                var gain = ctx.createGain();
                gain.gain.setValueAtTime(gainVal, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                src.connect(gain); gain.connect(ctx.destination);
                src.start(); src.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        function playSound(name) {
            switch(name) {
                case "hit":
                    // Batida na raquete: pop curto e agudo
                    playTone(520, "square", 0.07, 0.4, true);
                    playNoise(0.05, 0.15);
                    break;
                case "bounce":
                    // Ressalto no chao: toc grave
                    playTone(180, "sine", 0.12, 0.5, true);
                    playNoise(0.04, 0.2);
                    break;
                case "net":
                    // Bola na rede: thud surdo
                    playTone(100, "sawtooth", 0.15, 0.4, true);
                    playNoise(0.08, 0.25);
                    break;
            }
        }

        // Activar contexto de audio no primeiro toque (politica do browser)
        document.addEventListener("click", function() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();
        }, { once: true });
    </script>
    <script src="app.js"></script>
</body>
</html>
