<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Point Tennis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100vw; height: 100vh;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .phone-frame {
            position: relative;
            background: #000;
            border-radius: 36px;
            box-shadow: 0 0 0 6px #333, 0 0 60px rgba(0,0,0,0.9);
            overflow: hidden;
            flex-shrink: 0;
        }
        .phone-frame iframe { display: block; border: none; }

        #unlock-btn {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #unlock-btn .racket { font-size: 64px; margin-bottom: 16px; }
        #unlock-btn .label  { color:#FFD54F; font-family:monospace; font-size:22px; font-weight:bold; letter-spacing:2px; }
        #unlock-btn .sub    { color:#888; font-family:monospace; font-size:13px; margin-top:8px; }
        #unlock-btn.hidden  { display: none; }
    </style>
    <script src="coi-serviceworker.js"></script>
</head>
<body>

    <div id="unlock-btn">
        <div class="racket">&#127934;</div>
        <div class="label">MATCH POINT</div>
        <div class="sub">Toca para iniciar</div>
    </div>

    <div class="phone-frame" id="frame" style="display:none">
        <iframe id="game" src="game.html"
            allow="speaker; autoplay"
            scrolling="no" allowfullscreen></iframe>
    </div>

    <script>
        // ── flag de mute global ─────────────────────────────────────────────
        var isMuted = false;

        function resizeFrame() {
            var maxH = window.innerHeight * 0.92;
            var maxW = window.innerWidth  * 0.92;
            var h = maxH, w = maxH * 9 / 16;
            if (w > maxW) { w = maxW; h = maxW * 16 / 9; }
            h = Math.floor(h); w = Math.floor(w);
            var frame  = document.getElementById('frame');
            var iframe = document.getElementById('game');
            frame.style.width  = w + 'px';
            frame.style.height = h + 'px';
            iframe.width  = w; iframe.height = h;
            iframe.style.width  = w + 'px';
            iframe.style.height = h + 'px';
        }

        function pickVoice() {
            if (!window.speechSynthesis) return null;
            var voices = window.speechSynthesis.getVoices() || [];
            if (!voices.length) return null;
            function norm(v) { return (v.lang || '').replace(/_/g, '-').toLowerCase(); }
            return voices.find(function(v){ return norm(v) === 'en-us'; })
                || voices.find(function(v){ return norm(v).startsWith('en-'); })
                || voices.find(function(v){ return v.default; })
                || voices[0];
        }

        function doSpeak(text) {
            if (isMuted) return;                          // ← bloqueia árbitro
            if (!window.speechSynthesis) return;
            try {
                var synth = window.speechSynthesis;
                var voice = pickVoice();
                if (synth.paused) synth.resume();
                synth.cancel();
                var u = new SpeechSynthesisUtterance(text);
                u.rate = 0.95; u.pitch = 1.0; u.volume = 1.0;
                if (voice) {
                    u.voice = voice;
                    if (voice.lang) u.lang = voice.lang.replace(/_/g, '-');
                }
                u.onerror = function(e) {
                    console.warn('Speech error:', e.error,
                        'voice=', voice ? voice.name : 'none');
                };
                synth.speak(u);
            } catch(e) {
                console.warn('Speech exception:', e);
            }
        }

        function doCancelSpeech() {
            if (window.speechSynthesis) {
                try { window.speechSynthesis.cancel(); } catch(e) {}
            }
        }

        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
            window.speechSynthesis.getVoices();
        }

        var speechUnlocked = false;
        var unlockBtn = document.getElementById('unlock-btn');

        function handleUnlock(e) {
            e.preventDefault();
            if (!speechUnlocked) {
                speechUnlocked = true;
                if (window.speechSynthesis) {
                    try {
                        var voice = pickVoice();
                        window.speechSynthesis.cancel();
                        var u = new SpeechSynthesisUtterance('ready');
                        u.volume = 0.01; u.rate = 1.0;
                        if (voice) {
                            u.voice = voice;
                            if (voice.lang) u.lang = voice.lang.replace(/_/g, '-');
                        }
                        window.speechSynthesis.speak(u);
                    } catch(e2) {}
                }
            }
            unlockBtn.classList.add('hidden');
            document.getElementById('frame').style.display = 'block';
            resizeFrame();
        }

        unlockBtn.addEventListener('touchend', handleUnlock, { passive: false });
        unlockBtn.addEventListener('click',    handleUnlock);

        // ── Mensagens do iframe (game.html) ─────────────────────────────────
        window.addEventListener('message', function(event) {
            if (!event.data) return;
            var iframe = document.getElementById('game');

            if (event.data.type === 'SPEAK') {
                doSpeak(event.data.text);

            } else if (event.data.type === 'CANCEL_SPEECH') {
                doCancelSpeech();

            } else if (event.data.type === 'SET_MUTE') {
                // O Kotlin envia SET_MUTE directamente ao pai via postMessage
                isMuted = event.data.value;
                if (isMuted) doCancelSpeech();
                // Propagar ao iframe para silenciar o audioCtx
                if (iframe) iframe.contentWindow.postMessage(
                    { type: 'SET_MUTE', value: isMuted }, '*'
                );
            }
        });

        setInterval(function() {
            if (window.speechSynthesis && !window.speechSynthesis.speaking) {
                window.speechSynthesis.getVoices();
            }
        }, 5000);

        window.addEventListener('resize', resizeFrame);
    </script>
</body>
</html>
